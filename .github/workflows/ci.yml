name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

      - name: Smoke test the CLI on the examples
        run: |
          sbom-counsel --version
          sbom-counsel analyze examples/clean-project.cdx.json --gate -o /tmp/clean
          sbom-counsel analyze examples/mixed-project.spdx.json \
            --exceptions examples/exceptions.yaml --print json > /tmp/mixed.json
          python -c "import json; d=json.load(open('/tmp/mixed.json')); assert d['summary']['overall_posture']=='blocked'"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/sbom-counsel --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
