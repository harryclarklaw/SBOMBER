[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sbom-counsel"
description = "Open-source licence-risk analysis for software bills of materials (SBOMs)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sbom-counsel contributors" }]
keywords = [
    "sbom",
    "cyclonedx",
    "spdx",
    "license",
    "licence",
    "compliance",
    "open-source",
    "cra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "license-expression>=30.0.0",
    "packageurl-python>=0.13.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/harryclarklaw/sbomber"
Repository = "https://github.com/harryclarklaw/sbomber"
Changelog = "https://github.com/harryclarklaw/sbomber/blob/main/CHANGELOG.md"
Issues = "https://github.com/harryclarklaw/sbomber/issues"

[project.scripts]
sbom-counsel = "sbom_counsel.cli:main"

[tool.hatch.version]
path = "src/sbom_counsel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_counsel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "SIM105", # contextlib.suppress over try/except/pass — explicit is fine here
]

[tool.ruff.lint.isort]
known-first-party = ["sbom_counsel"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["license_expression.*", "packageurl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests favour readability over exhaustive annotation.
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true
